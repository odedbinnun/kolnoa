<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מה רואים הערב? — מחולל סרטים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14110f; --panel:#1d1916; --line:#3a322b; --ink:#f3ead9; --muted:#a89a86;
  --accent:#e8b04a; --accent-ink:#1b1408; --chip:#2a2420; --red:#c8553d; --poster:158px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Assistant,system-ui,sans-serif}
body{background:radial-gradient(1200px 600px at 80% -10%,#3a2a14 0%,transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:1360px;margin:0 auto;padding:28px 22px 60px;display:grid;grid-template-columns:370px 1fr;gap:28px;align-items:start}
header{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap}
h1{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:44px;line-height:1;margin:0;letter-spacing:-.5px}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:8px;font-size:16px}
.sub b{color:var(--ink);font-weight:700}
aside{position:static;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 18px 8px;scrollbar-width:thin}
.panel-top{position:static;background:var(--panel);z-index:2;display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.panel-top span{font-size:13px;color:var(--muted)}
.step{margin-bottom:20px}
.step h2{font-family:"Frank Ruhl Libre",serif;font-size:19px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.step h2 b,summary b{color:var(--accent);font-size:15px}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 10px}
.group-label{font-size:12.5px;color:var(--muted);margin:12px 0 6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13.5px Assistant,sans-serif;cursor:pointer;transition:.15s;text-align:right}
.chip:hover:not(:disabled){border-color:#6b5a48}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled{opacity:.25;cursor:not-allowed;border-style:dashed}
.chip small{display:block;font-weight:400;font-size:11.5px;opacity:.75}
.chip .c{font-weight:400;font-size:11px;opacity:.6;margin-inline-start:5px}
.mood .chip{border-radius:10px;padding:8px 11px;flex:1 1 calc(50% - 6px)}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;list-style:none;font-family:"Frank Ruhl Libre",serif;font-size:19px;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--accent)}
details[open] summary::after{content:"－"}
.range-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:2px}
.range-row b{color:var(--ink)}
.dual{position:relative;height:28px;direction:rtl}
.dual input{position:absolute;inset:0;width:100%;pointer-events:none;background:none;-webkit-appearance:none;appearance:none;margin:0}
.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}
.track{position:absolute;top:12px;height:4px;left:0;right:0;background:var(--line);border-radius:4px}
.track i{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:4px}
input[type=range]{accent-color:var(--accent)}
input[type=range].single{width:100%;direction:rtl}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.count{font-family:"Frank Ruhl Libre",serif;font-size:22px}
.count b{color:var(--accent);font-size:30px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:10px;padding:8px 13px;font:700 14px Assistant,sans-serif;cursor:pointer}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted);background:#1a1613;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.tools label{display:flex;align-items:center;gap:6px}
.tools select,.tools input[type=search],.field input{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font:600 13px Assistant,sans-serif}
.tools input[type=search]{width:130px}
.tools{gap:10px}
.who{display:flex;align-items:center;gap:6px}
.who[hidden]{display:none}
.who .mode{background:#2f261d;border:1px solid #4a3c2c;color:#e9d6b4;border-radius:8px;padding:5px 9px;font:700 12.5px Assistant,sans-serif;cursor:pointer;min-width:58px}
.who .mode.unseen{background:#3a2420;border-color:#6b3c30;color:#f2c3b4}
.clip{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:16px;cursor:pointer;line-height:1.3}
.clip[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.badge.clip-b{top:auto;bottom:8px;left:8px;font-size:13px;padding:1px 5px}
.worlds-chips .chip{padding:5px 10px;font-size:13px}
.path{border-radius:12px;padding:12px 12px 12px;border:1px solid var(--line)}
.path h3{font-family:"Frank Ruhl Libre",serif;font-size:17px;margin:0 0 9px}
.path-mood{background:linear-gradient(180deg,#2a2016,#221b15);border-color:#4a3a26}
.path-world{background:linear-gradient(180deg,#17222a,#151c21);border-color:#2c4050}
.path-world h3{color:#cfe3f0}
.path-world .chip[aria-pressed=true]{background:#8fc3df;border-color:#8fc3df;color:#0d1a22}
.band{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px 18px}
.band h2{font-family:"Frank Ruhl Libre",serif;font-size:19px;margin:0;display:flex;gap:8px;align-items:baseline;white-space:nowrap}
.band h2 b{color:var(--accent);font-size:15px}
.band-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.age-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.age-row .hint{margin:0}
.paths-title{margin-bottom:10px!important}
.paths-title .hint{font-family:Assistant,sans-serif;font-size:12.5px;color:var(--muted);font-weight:400}
.paths-row{display:flex;align-items:stretch;gap:0}
.paths-row .path{flex:1 1 0;min-width:0}
.path{padding:10px 8px}
.path h3{font-size:15px;line-height:1.2;min-height:2.4em}
.path-mood .mood{flex-direction:column}
.path-mood .mood .chip{flex:none;width:100%;padding:7px 9px;font-size:13px}
.path-mood .mood .chip small{font-size:11px}
.path-world .worlds-chips .chip{padding:5px 8px;font-size:12px;line-height:1.25}
.path-world .chip .c{display:none}
.or{position:relative;display:flex;align-items:center;justify-content:center;width:30px;flex:0 0 30px}
.or::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px dashed #4a3f35}
@media (max-width:880px){
  .paths-row{flex-direction:column}
  .or{width:auto;flex:0 0 26px;margin:10px 0}
  .or::before{left:0;right:0;top:50%;bottom:auto;border-left:0;border-top:1px dashed #4a3f35}
  .band-top{flex-direction:column;align-items:flex-start}
  .band h2{white-space:normal;flex-wrap:wrap}
  .band{padding:14px 12px}
  .wrap{padding:20px 12px 40px}
}
.band,.wrap>main,.wrap>aside{min-width:0}
.or-old span{position:relative;z-index:1;flex:0 0 auto;display:inline-block;text-align:center;width:34px;height:26px;line-height:24px;border-radius:13px;background:var(--panel);border:1px solid #5a4c3e;color:var(--accent);font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:15px}
.extras{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.extras h4{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.extras ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.extras li{background:#231e1a;border:1px solid #2f2822;border-radius:8px;padding:8px 10px;font-size:14px;position:relative}
.extras li a{color:var(--accent);font-weight:700;text-decoration:none}
.extras li .xt{white-space:pre-wrap;line-height:1.55;margin-top:4px;max-height:7.8em;overflow:hidden}
.extras li .xt.open{max-height:none}
.extras li .more{background:none;border:0;color:var(--muted);cursor:pointer;font:600 12.5px Assistant,sans-serif;padding:2px 0}
.extras li .del{position:absolute;top:4px;left:6px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px}
.extras form{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.extras form input,.extras form textarea{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 13.5px Assistant,sans-serif}
.extras form textarea{min-height:90px}
.vcfg{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;padding:0 4px}.vcfg:hover{color:var(--accent)}
.vrow{display:flex;gap:8px;align-items:center;margin:6px 0}.vrow input{flex:1;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:500 14px Assistant,sans-serif}
.watched{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.watched .chip{padding:4px 11px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--chip);color:var(--muted);border:0;padding:5px 10px;font:700 13px Assistant,sans-serif;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.active-tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.active-tags span{font-size:12px;background:#2f261d;border:1px solid #4a3c2c;color:#e9d6b4;border-radius:6px;padding:3px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--poster),1fr));gap:18px}
.grid.compact{gap:10px}
.grid.compact .worlds{display:none}
.grid.compact h3{font-size:12.5px}
.grid.tiny .meta,.grid.tiny h3{display:none}
.card{cursor:pointer;animation:fade .25s ease both;min-width:0}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.poster{aspect-ratio:2/3;border-radius:8px;overflow:hidden;background:#2a221b;box-shadow:0 8px 22px rgba(0,0,0,.45);position:relative;transition:transform .2s}
.card:hover .poster{transform:translateY(-3px) scale(1.015)}
.poster img{width:100%;height:100%;object-fit:cover;display:block}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:12px 10px;text-align:right}
.fallback .ft{font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:19px;line-height:1.08;unicode-bidi:plaintext}
.fallback .fy{font-size:13px;opacity:.8;letter-spacing:2px}
.badge{position:absolute;top:8px;left:8px;background:rgba(20,17,15,.85);color:var(--accent);font-size:11px;font-weight:700;border-radius:5px;padding:2px 6px}
.badge.edited{left:auto;right:8px;color:#9fd3a8}
.card h3{font-size:15px;margin:10px 0 2px;line-height:1.2;unicode-bidi:plaintext;text-align:right;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.worlds{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.worlds span{font-size:11px;color:#e3c58e;border:1px solid #4a3c2c;border-radius:5px;padding:1px 6px}
.relax{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:0 0 14px;font-size:14.5px;color:var(--muted)}
.relax button{background:var(--chip);border:1px solid var(--accent);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 13.5px Assistant,sans-serif;cursor:pointer}
.relax button:hover{background:var(--accent);color:var(--accent-ink)}
.relax button b{color:var(--accent);font-weight:800}
.relax button:hover b{color:var(--accent-ink)}
.empty .relax{margin:16px 0 0}
.xedit{display:flex;flex-direction:column;gap:10px}
.xedit .xi{background:#231e1a;border:1px solid #2f2822;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;position:relative}
.xedit .xi input,.xedit .xi textarea{background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:500 13.5px Assistant,sans-serif}
.xedit .xi textarea{min-height:70px}
.xedit .xi .xdel{align-self:flex-start;background:none;border:0;color:var(--muted);cursor:pointer;font:600 12.5px Assistant,sans-serif;padding:0}
.xedit .xi .xdel:hover{color:#e08a7a}
.wlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-width:720px}
.wrow{display:flex;align-items:center;gap:14px;background:var(--card,#1d1814);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px;cursor:grab;user-select:none;-webkit-user-select:none;transition:box-shadow .15s,transform .15s}
.wrow:hover{border-color:#5a4a36}
.wrow .num{font:700 18px 'Frank Ruhl Libre',serif;color:var(--accent);min-width:1.6em;text-align:center}
.wrow .wp{position:relative;width:54px;flex:none;border-radius:6px;overflow:hidden;aspect-ratio:2/3;background:#2a231d}
.wrow .wp img,.wrow .wp .ph{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.wrow .wi{flex:1;min-width:0}
.wrow .wi b{display:block;font-size:16px;unicode-bidi:plaintext;text-align:right;line-height:1.25}
.wrow .wi small{color:var(--muted);font-size:13px}
.wrow .grip{font-size:20px;color:var(--muted);padding:6px 4px;touch-action:none;cursor:grab;letter-spacing:-3px}
.wrow.dragging{cursor:grabbing;box-shadow:0 10px 28px rgba(0,0,0,.55);border-color:var(--accent);transform:scale(1.02);position:relative;z-index:5;opacity:.95}
.wrow .wp .fallback{position:absolute;inset:0;font-size:7px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:2px}
.wrow .wp .fallback .ft{font-size:8px}.wrow .wp .fallback .fy{font-size:7px;letter-spacing:0}
.whint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:17px;border:1px dashed var(--line);border-radius:14px}
/* table view */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 220px)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 9px;border-bottom:1px solid #2c2520;text-align:right;vertical-align:top}
th{position:sticky;top:0;background:#231e1a;color:var(--muted);font-weight:700;white-space:nowrap;z-index:1}
tbody tr{cursor:pointer}
tbody tr:hover{background:#221c18}
tr.hidden-film{opacity:.4}
td.t{font-weight:700;unicode-bidi:plaintext;min-width:180px}
td .tg{display:inline-block;font-size:11px;border:1px solid #4a3c2c;border-radius:5px;padding:0 5px;margin:1px;color:#e3c58e;white-space:nowrap}
/* modal */
.modal{position:fixed;inset:0;background:rgba(8,6,5,.78);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:720px;width:100%;max-height:calc(100vh - 40px);overflow:auto;display:grid;grid-template-columns:190px 1fr;gap:20px;padding:20px;position:relative}
.sheet .poster{box-shadow:none}
.sheet h3{font-family:"Frank Ruhl Libre",serif;font-size:28px;margin:0 0 6px;unicode-bidi:plaintext;text-align:right}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:14px 0}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0}
.credits{font-size:14.5px;margin-top:8px;line-height:1.4}
.acc{color:var(--accent);font-size:13.5px;font-weight:700;margin:4px 0 2px;line-height:1.45}
.syn{font-size:15.5px;line-height:1.65;margin:12px 0 4px;padding:10px 12px;background:#231e1a;border-right:3px solid var(--accent);border-radius:6px}
.credits span{color:var(--muted)}
.links a{color:var(--accent);font-weight:700;margin-left:14px}
.close{position:absolute;top:10px;left:12px;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer}
.field{margin-bottom:10px}
.field>label{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:5px}
.field input{width:100%;font-size:14px;padding:7px 9px}
.field textarea{width:100%;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:500 14.5px/1.6 Assistant,sans-serif;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.edit-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2b3a2e;border:1px solid #4d6b52;color:#d9f0dc;padding:9px 16px;border-radius:10px;font-weight:600;display:none;z-index:20}
.editbar{display:none;background:#26301f;border:1px solid #4d6b3a;color:#dbe9c9;border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13.5px;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
body.editing .editbar{display:flex}
@media (max-width:880px){
  .wrap{grid-template-columns:1fr}
  aside{position:static;max-height:none}
  h1{font-size:34px}
  .sheet{grid-template-columns:1fr}
  .sheet .poster{max-width:160px}
}

/* mood | or | world */
.pgrid{display:grid;grid-template-columns:1fr 30px 1fr;grid-template-areas:"hm or hw" "bm . bw";column-gap:0;row-gap:0}
.ph{margin:0;padding:8px 9px;min-height:58px;display:flex;align-items:center;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:15px;line-height:1.25;background:#e8b04a;color:#1b1408;border-radius:10px 10px 0 0;border:1px solid #e8b04a}
.ph-m{grid-area:hm}.ph-w{grid-area:hw}
.por{grid-area:or;display:flex;align-items:center;justify-content:center;background:#d0703a;margin:6px 0;border-radius:0}
.por span{color:#fff;font-family:"Frank Ruhl Libre",serif;font-weight:900;font-size:16px;line-height:1}
.pb{background:#221b15;border:1px solid #e8b04a;border-top:0;border-radius:0 0 10px 10px;padding:8px 7px}
.pb-m{grid-area:bm}.pb-w{grid-area:bw}
.pb-m .mood{flex-direction:column}
.pb-m .mood .chip{flex:none;width:100%;padding:7px 9px;font-size:13px}
.pb-m .mood .chip small{font-size:11px}
.pb-w .chip{padding:5px 8px;font-size:12px;line-height:1.25}
.pb-w .chip .c{display:none}
@media (max-width:880px){
  .pgrid{grid-template-columns:1fr;grid-template-areas:"hm" "bm" "or" "hw" "bw"}
  .por{margin:0 auto;width:60px;height:30px;border-radius:15px}
  .pb-m{margin-bottom:8px}
}

@media (min-width:881px){
  .gridwrap{max-height:calc(100vh - 220px);overflow:auto;padding:6px 4px 10px 10px;margin:-6px -4px 0 -10px;scrollbar-width:thin}
}
.reset-btn{display:inline-flex;align-items:center;gap:6px}
.reset-btn svg{color:var(--accent)}
.wishbtn{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font:700 13px Assistant,sans-serif;color:var(--ink);cursor:pointer;white-space:nowrap}
.wishbtn[hidden]{display:none}
.wishbtn[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.wishbtn span{font-weight:400;opacity:.7}

<style>

#intro.lift{opacity:0;pointer-events:none}

#introPlay,#introSkip{z-index:3}
#intro::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75));pointer-events:none;animation:flick 3.2s infinite steps(1)}
@keyframes flick{0%{opacity:1}7%{opacity:.86}9%{opacity:1}53%{opacity:.92}55%{opacity:1}}
#introPlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:none;border:0;color:#e8d3a6;cursor:pointer;padding:20px;border-radius:50%;transition:opacity 1.2s,transform .3s}
#introPlay svg{filter:drop-shadow(0 0 14px rgba(232,176,74,.55));animation:breathe 2.6s ease-in-out infinite}

@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.6);opacity:0}}

#quotes{position:absolute;inset:0;pointer-events:none}
.q{position:absolute;color:#efe4cf;opacity:0;white-space:pre-line;text-shadow:0 0 22px rgba(0,0,0,.95);direction:ltr;line-height:1.18;will-change:opacity,transform;transition:opacity var(--fin,2.6s) ease-in-out,transform 14s linear}
.q.on{opacity:var(--op,.93)}
.q.out{opacity:0;transition:opacity var(--fout,3.2s) ease-in-out,transform 14s linear}
.q.classic{font-family:"Frank Ruhl Libre",Georgia,serif;font-style:italic}

#finalLine{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(780px,86vw);text-align:center;color:#f3ead9;font-family:"Frank Ruhl Libre",serif;font-weight:700;font-size:clamp(24px,3.4vw,40px);line-height:1.45;opacity:0;transition:opacity 2s ease}

#introSkip:hover{color:rgba(243,234,217,.7)}
</style>
<script>
(function(){
  if(location.hash!=='#nuri') return;
  const QUOTES=[
    ['Hello, Clarice.','m'],
    ["When you have to shoot, shoot.\nDon't talk.",'c'],
    ["There are no two words in the English language more harmful than \u2018good job\u2019.",'m'],
    ['Carpe diem.','m'],
    ['I love the smell of napalm in the morning.','c'],
    ["I'm gonna make him an offer he can't refuse.",'c'],
    ["I'm sorry, Dave.\nI'm afraid I can't do that.",'m'],
    ["Life is like a box of chocolates.\nYou never know what you're gonna get.",'c'],
  ];
  const $i=id=>document.getElementById(id);
  const intro=$i('intro'); intro.hidden=false; document.documentElement.style.overflow='hidden';
  // film texture: grain, scratches, dust, flicker
  const cv=$i('grain'), cx=cv.getContext('2d'); let grainT;
  function sizeCv(){ cv.width=Math.round(innerWidth*0.6); cv.height=Math.round(innerHeight*0.6); }
  sizeCv(); addEventListener('resize',sizeCv);
  const tiles=[...Array(6)].map(()=>{const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');const im=g.createImageData(160,160);
    for(let i=0;i<im.data.length;i+=4){const v=Math.random();const l=v>0.5?255:0;im.data[i]=im.data[i+1]=im.data[i+2]=l;im.data[i+3]=Math.pow(Math.abs(v-0.5)*2,3)*255;}g.putImageData(im,0,0);return c;});
  let scr={x:Math.random(),v:0.0006,life:0};
  function frame(){
    const W=cv.width,H=cv.height; cx.clearRect(0,0,W,H);
    // grain
    const pat=cx.createPattern(tiles[(Math.random()*tiles.length)|0],'repeat');
    cx.save(); cx.translate(-Math.random()*160,-Math.random()*160); cx.globalAlpha=0.16; cx.fillStyle=pat; cx.fillRect(0,0,W+160,H+160); cx.restore();
    // a long scratch that wanders slowly and sometimes disappears
    scr.x+=scr.v+(Math.random()-0.5)*0.0015; if(scr.x<0.05||scr.x>0.95) scr.v*=-1;
    if(Math.random()<0.012) scr.life=40+Math.random()*90;
    if(scr.life>0){ scr.life--; cx.globalAlpha=0.12+Math.random()*0.22; cx.strokeStyle='#fff'; cx.lineWidth=Math.random()<0.5?1:1.5;
      const x=scr.x*W; cx.beginPath(); cx.moveTo(x,0); cx.lineTo(x+(Math.random()-0.5)*2,H); cx.stroke(); }
    // short random scratches
    const n=Math.random()<0.35?1+(Math.random()*2|0):0;
    for(let k=0;k<n;k++){ const x=Math.random()*W, y=Math.random()*H*0.6, h=H*(0.2+Math.random()*0.8);
      cx.globalAlpha=0.08+Math.random()*0.2; cx.strokeStyle=Math.random()<0.8?'#fff':'#000'; cx.lineWidth=Math.random()*1.2+0.4;
      cx.beginPath(); cx.moveTo(x,y); cx.lineTo(x+(Math.random()-0.5)*6,y+h); cx.stroke(); }
    // dust and hairs
    if(Math.random()<0.45){ const m=1+(Math.random()*3|0);
      for(let k=0;k<m;k++){ const x=Math.random()*W,y=Math.random()*H; cx.globalAlpha=0.35+Math.random()*0.45; cx.fillStyle=cx.strokeStyle=Math.random()<0.7?'#e9e2d0':'#000';
        if(Math.random()<0.75){ cx.beginPath(); cx.arc(x,y,0.6+Math.random()*2.2,0,7); cx.fill(); }
        else { cx.lineWidth=0.8; cx.beginPath(); cx.moveTo(x,y); cx.quadraticCurveTo(x+(Math.random()-0.5)*40,y+(Math.random()-0.5)*40,x+(Math.random()-0.5)*50,y+(Math.random()-0.5)*50); cx.stroke(); } } }
    // exposure flicker
    cx.globalAlpha=Math.random()*0.035; cx.fillStyle='#fff'; cx.fillRect(0,0,W,H); cx.globalAlpha=1;
  }
  grainT=setInterval(frame,1000/24); frame();
  // projector sound (synthesised)
  let ac, master;
  function startSound(){
    try{
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.gain.value=0; master.connect(ac.destination);
      master.gain.linearRampToValueAtTime(0.5,ac.currentTime+1.5);
      const len=ac.sampleRate*2, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
      // motor hum
      const n=ac.createBufferSource(); n.buffer=buf; n.loop=true;
      const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
      const hg=ac.createGain(); hg.gain.value=0.18; n.connect(lp).connect(hg).connect(master); n.start();
      const hum=ac.createOscillator(); hum.type='sawtooth'; hum.frequency.value=48;
      const hf=ac.createBiquadFilter(); hf.type='lowpass'; hf.frequency.value=160;
      const hug=ac.createGain(); hug.gain.value=0.05; hum.connect(hf).connect(hug).connect(master); hum.start();
      // shutter clicks ~ 18/s
      const clickBuf=ac.createBuffer(1,ac.sampleRate*0.02,ac.sampleRate), cd=clickBuf.getChannelData(0);
      for(let i=0;i<cd.length;i++) cd[i]=(Math.random()*2-1)*Math.pow(1-i/cd.length,6);
      let t=ac.currentTime+0.05;
      (function sched(){
        while(t<ac.currentTime+0.4){
          const s=ac.createBufferSource(); s.buffer=clickBuf;
          const bp=ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2200+Math.random()*600; bp.Q.value=1.2;
          const g=ac.createGain(); g.gain.value=0.22+Math.random()*0.08;
          s.connect(bp).connect(g).connect(master); s.start(t);
          t+=1/18+(Math.random()-0.5)*0.006;
        }
        if(ac.state!=='closed') setTimeout(sched,150);
      })();
    }catch(e){}
  }
  function stopSound(after){ if(!ac) return; try{ master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(master.gain.value,ac.currentTime); master.gain.linearRampToValueAtTime(0,ac.currentTime+after); setTimeout(()=>ac.close(),after*1000+200);}catch(e){} }
  // placement: spread quotes over a 3x4 grid of zones, shuffled
  function zones(){const z=[];for(let r=0;r<4;r++)for(let c=0;c<3;c++)z.push([c,r]);return z.sort(()=>Math.random()-0.5);}
  let timers=[], done=false;
  const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
  function finish(fast){
    if(done) return; done=true; timers.forEach(clearTimeout);
    stopSound(fast?0.4:2.4);
    intro.classList.add('lift');
    setTimeout(()=>{intro.hidden=true;clearInterval(grainT);document.documentElement.style.overflow='';},fast?600:2600);
  }
  $i('introSkip').onclick=()=>finish(true);
  $i('introPlay').onclick=()=>{
    $i('introPlay').classList.add('gone');
    startSound();
    const box=$i('quotes'), W=innerWidth, H=innerHeight, k=Math.max(.55,Math.min(1,W/1300));
    const N=QUOTES.length, GOLD=2.39996, a0=Math.random()*6.283;
    const shown=[]; // rects still on screen
    const overlap=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
    const fin=2.2, fout=3.0;
    let at=1300;
    QUOTES.forEach(([text,style],qi)=>{
      const len=text.replace(/\n/g,' ').length;
      const fs=Math.round(Math.max(22,Math.min(74,320/Math.sqrt(len)))*k);   // short = big, long = small
      const hold=900+len*32;
      later(()=>{
        const el=document.createElement('div');
        el.className='q '+({c:'classic',m:'modern',s:'classic'})[style];
        el.style.fontSize=fs+'px'; el.style.maxWidth=Math.round(W*(len>60?.4:.46))+'px'; el.style.textAlign='center';
        el.style.setProperty('--fin',fin+'s'); el.style.setProperty('--fout',fout+'s'); el.style.setProperty('--op',(0.42+0.53*Math.min(1,Math.max(0,(fs/k-22)/(74-22)))).toFixed(2));   // smaller = fainter, as if further away
        el.textContent=text; box.appendChild(el);
        const b=el.getBoundingClientRect(), m=Math.max(16,W*.03);
        // the first quote sits at the centre; each next one is placed a little further out (a widening spiral)
        const t=qi===0?0:Math.sqrt(qi/(N-1));
        let best=null;
        for(let tr=0;tr<10;tr++){
          const ang=a0+qi*GOLD+tr*0.63, rr=t*(1+tr*0.04);
          let cxp=W/2+Math.cos(ang)*rr*W*0.33, cyp=H/2+Math.sin(ang)*rr*H*0.34;
          let x=cxp-b.width/2, y=cyp-b.height/2;
          x=Math.max(m,Math.min(W-b.width-m,x)); y=Math.max(m,Math.min(H-b.height-m*2,y));
          const R={x,y,w:b.width,h:b.height}; const o=shown.reduce((s,q)=>s+overlap(R,q),0);
          if(!best||o<best.o){best={R,o};} if(o===0) break;
        }
        const R=best.R; shown.push(R);
        el.style.left=R.x+'px'; el.style.top=R.y+'px';
        const dx=(Math.random()-.5)*22, dy=(Math.random()-.5)*12;
        el.style.transform='scale(.985)';
        requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.classList.add('on'); el.style.transform=`translate(${dx}px,${dy}px) scale(1.02)`; }));
        setTimeout(()=>{ el.classList.add('out'); setTimeout(()=>{ el.remove(); shown.splice(shown.indexOf(R),1); },fout*1000+100); }, fin*1000+hold);
      },at);
      // next quote starts while earlier ones are still on screen
      at+= 1500 + len*14;
    });
    const end=at+fin*1000+1200;
    later(()=>{ $i('finalLine').innerHTML='ויש עוד כל כך הרבה סרטים להכיר<br>ביחד ולפטפט עליהם.'; $i('finalLine').classList.add('on'); }, end);
    later(()=>{ $i('finalLine').classList.remove('on'); }, end+3600);
    later(()=>finish(false), end+5200);
  };
})();
</script>

 שף אגדי בטאייפה שאיבד את חוש הטעם, מבשל כל יום ראשון ארוחה מפוארת לשלוש בנותיו הבוגרות. מעבר לאוכל, כל אחת מהן מסתירה סוד והן לא מצליחות לדבר זו עם זו. סרט חם ומשעשע של אנג לי."}, {"id": 117, "t": "Secrets & Lies", "y": 1996, "m": ["T"], "f": "l", "h": 0, "s": "r", "d": 136, "p": 1, "l": "en", "w": ["life"], "a": ["a"], "i": "tt0117589", "dr": ["מייק לי"], "c": ["טימותי ספול", "ברנדה בלתין", "פיליס לוגן"], "sy": "הורטנס, אופטומטריסטית שחורה ומצליחה בלונדון, מחפשת את אמה הביולוגית אחרי שאמה המאמצת מתה. כשהיא מוצאת אותה, מתברר שזו סינתיה, פועלת לבנה ובודדה. מייק לי בסרט על משפחה, סודות ושקרים קטנים.", "ac": ["דקל הזהב, קאן 1996"]}, {"id": 118, "t": "Living in Oblivion", "y": 1995, "m": ["L"], "f": "l", "h": 0, "s": "r", "d": 90, "p": 0, "l": "en", "w": ["art"], "a": ["a"], "i": "tt0113677", "dr": ["טום די'סילו"], "c": ["סטיב בושמי", "קתרין קינר", "דרמוט מלרוני"], "sy": "במאי של סרט אינדי דל תקציב מנסה לצלם סצנה אחת ביום אחד. השחקנים מתווכחים, המכשירים מתקלקלים, ומכונת העשן מסרבת לעבוד. קומדיה מצחיקה מאוד על עשיית סרטים."}, {"id": 119, "t": "The Squid and the Whale", "y": 2005, "m": ["T", "L"], "f": "l", "h": 0, "s": "r", "d": 81, "p": 0, "l": "en", "w": ["life", "youth"], "a": ["a"], "i": "tt0367089", "dr": ["נואה באומבאך"], "c": ["ג'ף דניאלס", "לורה ליני", "ג'סי אייזנברג"], "sy": "ברוקלין, 1986. שני אחים, בני 16 ו־12, מתמודדים עם הגירושים של הוריהם, שניהם סופרים, וכל אחד מהם בוחר צד. קומדיה דרמטית, כנה וכואבת, של נואה באומבך, מבוססת על הילדות שלו."}, {"id": 120, "t": "Jerry Maguire", "y": 1996, "m": ["R", "L"], "f": "l", "h": 0, "s": "r", "d": 139, "p": 0, "l": "en", "w": ["sport"], "a": ["a"], "i": "tt0116695", "dr": ["קמרון קרואו"], "c": ["טום קרוז", "קיובה גודינג ג'וניור", "רנה זלווגר"], "sy": "ג'רי מגוויר, סוכן ספורט מצליח, כותב בלילה אחד מסמך על מצפון בעבודה, ומפוטר כבר למחרת. רק לקוח אחד נשאר איתו, שחקן פוטבול רעשני, ולצידו מזכירה אחת שמאמינה בו. \"תראה לי את הכסף!\""}, {"id": 121, "t": "Il Postino", "y": 1994, "m": ["R", "T"], "f": "l", "h": 0, "s": "r", "d": ": 0, "l": "en", "w": ["art"], "a": ["k", "t", "a"], "i": "tt0018773", "dr": ["צ'ארלי צ'פלין"], "c": ["צ'ארלי צ'פלין", "אל ארנסט גרסיה", "מרנה קנדי"], "sy": "הנווד של צ'פלין, שבורח מהמשטרה, נקלע לקרקס ומצחיק את הקהל בלי כוונה. בעל הקרקס מנצל אותו, והנווד מתאהב ברוכבת הקרקס, הבת של הבעלים. כולל סצנה בלתי נשכחת עם קופים על חבל דק."}, {"id": 181, "t": "The Cameraman", "y": 1928, "m": ["L", "R"], "f": "l", "h": 0, "s": "r", "d": 76, "p": 0, "l": "en", "w": ["art"], "a": ["k", "t", "a"], "i": "tt0018742", "dr": ["אדוארד סדג'וויק", "באסטר קיטון"], "c": ["באסטר קיטון", "Marceline Day"], "sy": "צלם תמונות פשוט מתאהב במזכירה בחברת חדשות קולנועיות, ומחליט להיות צלם עיתונות כדי להיות קרוב אליה. בעזרת מצלמה ישנה וקוף הוא מצלם סצנות מטורפות. קומדיה של באסטר קיטון."}, {"id": 182, "t": "City Lights", "y": 1931, "m": ["L", "R", "F"], "f": "l", "h": 0, "s": "r", "d": 87, "p": 0, "l": "en", "w": ["life"], "a": ["k", "t", "a"], "i": "tt0021749", "dr": ["צ'ארלי צ'פלין"], "c": ["צ'ארלי צ'פלין", "וירג'יניה צ'ריל", "Florence Lee"], "sy": "הנווד מתאהב בנערה עיוורת שמוכרת פרחים, והיא חושבת שהוא מיליונר. כדי לעזור לה הוא מנסה להשיג כסף בכל דרך, כולל קרב אגרוף. סרט אילם מלא צחוק ורגש, עם אחד הסופים הגדולים בקולנוע."}, {"id": 183, "t": "I Was Born, But...", "y": 1932, "m": ["L", "F"], "f": "l", "h": 0, "s": "r", "d": 90, "p": 1, "l": "ot", "w": ["youth"], "a": ["k", "a"], "i": "tt0023634", "dr": ["יסוג'ירו אוזו"], "c": ["Tatsuo Saitō", "Tomio Aoki", "Mitsuko Yoshikawa"], "sy": "שני אחים קטנים עוברים עם משפחתם לפרבר של טוקיו, ונלחמים כדי לזכות בכבוד בין ילדי השכונה. הם בטוחים שאביהם הוא האדם הכי חשוב בעולם, עד שהם רואים אותו מול הבוס שלו. קומדיה אילמת ומרגשת של אוזו."}, {"id": 184, "t": "Duck Soup", "y": 1933, "m": ["L"], "f": "l", "h": 0, "s": "r", "d": 68, "p": 0, "l": "en", "w": ["pol", "war"], "a": ["k", "t", "a"], "i": "tt0023969", "dr": ["לאו מקארי"], "c": ["גראוצ'ו מרקס", "הארפו מרקס", "צ'יקו מרקס"], "sy": "רופוס ת. פיירפליי, איש מטורף לגמרי, מתמנה לשליט של מדינה קטנה ומרוששת בשם פרידוני  ובו בזמן חושף את המחיר שלה: ככל שאנו הופכים את העולם לתמונה, אנו מתרחקים מן האפשרות להשתתף בו.\n\nג׳ף הוא אדם שהחליף פעולה במבט, אינטימיות במרחק וחיים בדימויים. השאלה שהסרט מפנה אליו — וגם אלינו — היא האם ההתבוננות מקרבת אותנו אל החיים, או מאפשרת לנו להתחמק מהם."}], "sy": "צלם עיתונות (ג'יימס סטיוארט) מרותק לכיסא גלגלים בגלל רגל שבורה, ומעביר את ימי הקיץ בהצצה מהחלון לדירות של השכנים. כשאחד השכנים מתחיל להתנהג בצורה מוזרה, הוא חושד שנרצחה שם אישה."}, {"id": 223, "t": "12 Angry Men", "y": 1957, "m": ["T", "S"], "f": "l", "h": 0, "s": "r", "d": 96, "p": 0, "l": "en", "w": ["crime"], "a": ["t", "a"], "i": "tt0050083", "dr": ["סידני לומט"], "c": ["הנרי פונדה", "לי ג'יי. קוב", "אד בגלי"], "sy": "תריסר מושבעים צריכים להחליט על גורלו של נער שמואשם ברצח אביו. אחד עשר מהם בטוחים שהוא אשם. רק אחד מבקש לדבר על זה קודם. דרמה שמתרחשת כמעט כולה בחדר אחד.", "ac": ["דוב הזהב, ברלין 1957"]}, {"id": 224, "t": "Mon Oncle", "y": 1958, "m": ["L"], "f": "l", "h": 0, "s": "r", "d": 117, "p": 1, "l": "fr", "w": ["life"], "a": ["k", "a"], "i": "tt0050706", "dr": ["ז'אק טאטי"], "c": ["ז'אק טאטי", "Jean-Pierre Zola", "Adrienne Servantie"], "sy": "מסייה הולו, איש פשוט ומגושם, מבקר את אחותו שגרה בבית מודרני וחדשני מלא גאדג'טים, ומבלה עם האחיין הקטן שלו. קומדיה עדינה של ז'אק טאטי על הקידמה, כמעט בלי מילים.", "ac": ["אוסקר לסרט הזר הטוב ביותר"]}, {"id": 225, "t": "Vertigo", "y": 1958, "m": ["S", "R"], "f": "l", "h": 0, "s": "r", "d": 128, "p": 1, "l": "en", "w": ["crime"], "a": ["a"], "i": "tt0052357", "dr": ["אלפרד היצ'קוק"], "c": ["ג'יימס סטיוארט", "קים נובאק", "ברברה בל גדס"], "x": [{"title": "משהו קצר וקולע של הניו יורק טיימס", "url": "https://www.youtube.com/watch?v=rHxdPHMsIdk"}, {"title": "סקורסזה על ורטיגו", "url": "https://www.youtube.com/watch?v=StcvV1pZXz4"}], "sy": "סקוטי, בלש לשעבר עם פחד גבהים, נשכר כדי לעקוב אחרי אשתו של חבר, שמתנהגת כאילו רוח רפאים שולטת בה. הוא מתאהב בה, ונכנס לסחרור. אחד הסרטים הגדולים שנעשו.", "ac": ["סייט אנד סאונד 2022: מקום 2 בסקר המבקרים, ובעשירייה הראשונה וודי אלן, עם צילומי ארכיון מזויפים."}, {"id": 326, "t": "Manhattan", "y": 1979, "m": ["L", "R", "T"], "f": "l", "h": 0, "s": "r", "d": 96, "l": "en", "w": ["life", "art"], "a": ["a"], "i": "tt0079522", "dr": ["וודי אלן"], "c": ["וודי אלן", "דיאן קיטון", "מרייל המינגוויי"], "sy": "אייזק, כותב טלוויזיה גרוש בן 42, יוצא עם נערה בת 17 ומתאהב באהובתו של החבר הכי טוב שלו. ניו יורק בשחור לבן, לצלילי גרשווין. אחד הסרטים האישיים והיפים של וודי אלן."}, {"id": 327, "t": "Hannah and Her Sisters", "y": 1986, "m": ["L", "T", "R"], "f": "l", "h": 0, "s": "r", "d": 106, "l": "en", "w": ["life"], "a": ["a"], "i": "tt0091167", "dr": ["וודי אלן"], "c": ["מיה פארו", "מייקל קיין", "דיאן ויסט"], "sy": "שלוש אחיות בניו יורק, לאורך שנתיים בין ארוחת חג ההודיה אחת לבאה. בעלה של חנה מתאהב באחותה, אחות אחרת מחפשת את עצמה, והבעל לשעבר של חנה, היפוכונדר, משוכנע שהוא גוסס ומחפש משמעות. וודי אלן במיטבו."}, {"id": 328, "t": "The Purple Rose of Cairo", "y": 1985, "m": ["L", "R", "T"], "f": "l", "h": 0, "s": "m", "d": 82, "l": "en", "w": ["art", "life"], "a": ["t", "a"], "i": "tt0089853", "dr": ["וודי אלן"], "c": ["מיה פארו", "ג'ף דניאלס", "דני איילו"], "sy": "ניו ג'רזי, שנות השפל הגדול. ססיליה, מלצרית שבעלה מכה ומזניח אותה, בורחת לבית הקולנוע ורואה את אותו סרט שוב ושוב. יום אחד גיבור הסרט מסתובב אליה, ויוצא מהמסך כדי להיות איתה. אגדה מתוקה ומרירה של וודי אלן על אהבה לקולנוע."}, {"id": 329, "t": "Broadcast News", "y": 1987, "m": ["L", "R"], "f": "l", "h": 0, "s": "r", "d": 133, "l": "en", "w": ["life", "pol"], "a": ["t", "a"], "i": "tt0092699", "dr": ["ג'יימס ל. ברוקס"], "c": ["הולי האנטר", "ויליאם הרט", "אלברט ברוקס"], "sy": "ג'יין, מפיקת חדשות מבריקה ונוירוטית בוושינגטון, נקרעת בין שני גברים: כתב חכם ומצחיק שאין לו כריזמה מול המצלמה, ומגיש יפה וחביב שלא מבין כלום בחדשות. קומדיה רומנטית חכמה על טלוויזיה ועל אמת."}, {"id": 330, "t": "Women on the Verge of a Nervous Breakdown", "y": 1988, "m": ["L", "R"], "f": "l", "h": 0, "s": "r", "d": 89, "l": "ot", "w": ["life"], "a": ["a"], "i": "tt0095675", "dr": ["פדרו אלמודובר"], "c": ["כרמן מאורה", "אנטוניו בנדרס", "חולייטה סראנו"], "sy": "מדריד. פֶּפָּה, שחקנית דיבוב, מגלה שהמאהב שלה עזב אותה בהודעה במשיבון, ומנסה נואשות למצוא אותו. בדירה שלה מתאספות חברה שמסתתרת ממחבלים, אשתו לשעבר של המאהב, הבן שלו וגספצ'ו עם כדורי שינה. קומדיה צבעונית ופרועה של פדרו אלמודובר."}, {"id": 331, "t": "The Graduate", "y": 1967, "m": ["L", "R", "T"], "f": "l", "h": 0, "s": "r", "d": 106, "l": "en", "w": ["youth", "life"], "a": ["a"], "i": "tt0061722", "dr": ["מייק ניקולס"], "c": ["דסטין הופמן", "אן בנקרופט", "קתרין רוס"], "sy": "בנג'מין בראדוק חוזר הביתה לקליפורניה אחרי הקולג', בלי שום מושג מה לעשות עם החיים שלו. גברת רובינסון, אשתו של השותף של אביו, מפתה אותו, והכול מסתבך כשהוא מתאהב בבת שלה. סרט שהגדיר דור, עם השירים של סיימון וגרפונקל."}, {"id": 332, "t": "Sideways", "y": 2004, "m": ["L", "T"], "f": "l", "h": 0, "s": "r", "d": 127, "l": "en", "w": ["life", "nature"], "a": ["a"], "i": "tt0375063", "dr": ["אלכסנדר פיין"], "c": ["פול ג'יאמטי", "תומאס היידן צ'רץ", "וירג'יניה מדסן"], "sy": "מיילס, מורה לאנגלית מדוכא וסופר כושל שמתמצא ביין, לוקח את החבר הכי טוב שלו, שחקן נהנתן שעומד להתחתן, לשבוע של סיור ביקבים בקליפורניה. לכל אחד מהם יש תוכנית אחרת לגמרי לשבוע הזה. קומדיה מרירה ומצחיקה של אלכסנדר פיין."}, {"id": 333, "t": "Toni Erdmann", "y": 2016, "m": ["L", "T"], "f": "l", "h": 0, "s": "r", "d": 162, "l": "ot", "w": ["life"], "a": ["a"], "i": "tt4048272", "dr": ["מארן אדה"], "c": ["פיטר סימוניצ'ק", "סנדרה הולר", "אינגריד בישו"], "sy": "וינפריד, מורה גרמני לפנסיה שאוהב מתיחות, מגיע בהפתעה לבוקרשט לבקר את בתו אינס, יועצת עסקית קשוחה ועסוקה מדי. כשהיא מבקשת שיעזוב, הוא חוזר עם פאה ושיניים תותבות בתור \"טוני ארדמן\", ונכנס לחיים שלה. קומדיה גרמנית מפתיעה ומרגשת של מארן אדה."}, {"id": 334, "t": "After Hours", "y": 1985, "m": ["L", "S"], "f": "l", "h": 0, "s": "r", "d": 97, "l": "en", "w": ["life", "crime"], "a": ["a"], "i": "tt0088680", "dr": ["מרטין סקורסזה"], "c": ["גריפין דאן", "רוזנה ארקט", "ורנה בלום"], "sy": "פול, מתכנת משועמם, נוסע באמצע הלילה לסוהו כדי לפגוש בחורה שהכיר בבית קפה. מכאן הלילה הופך לשרשרת של אסונות מוזרים, והוא לא מצליח לחזור הביתה. קומדיה שחורה וסיוטית של מרטין סקורסזה."}, {"id": 335, "t": "The King of Comedy", "y": 1982, "m": ["L", "T"], "f": "l", "h": 0, "s": "r", "d": 109, "l": "en", "w": ["art", "crime"], "a": ["a"], "i": "tt0085794", "dr": ["מרטין סקורסזה"], "c": ["רוברט דה נירו", "ג'רי לואיס", "סנדרה ברנהרד"], "sy": "רופרט פאפקין, קומיקאי חובב שגר עם אמא שלו, משוכנע שהוא כוכב. הוא עושה הכול כדי להופיע בתוכנית האירוח של ג'רי לנגפורד, המנחה שהוא מעריץ, ובשלב מסוים הוא מוכן לעבור כל גבול. סאטירה של מרטין סקורסזה על תהילה, עם רוברט דה נירו."}, {"id": 336, "t": "Barton Fink", "y": 1991, "m": ["T", "S", "L"], "f": "l", "h": 0, "s": "m", "d": 116, "l": "en", "w": ["art", "hist"], "a": ["a"], "i": "tt0101410", "dr": ["ג'ואל כהן", "איתן כהן"], "c": ["ג'ון טורטורו", "ג'ון גודמן", "ג'ודי דייוויס"], "sy": "ניו יורק, 1941. בארטון פינק, מחזאי צעיר ונלהב שרוצה לכתוב על \"האדם הפשוט\", מגיע להוליווד כדי לכתוב תסריט לסרט היאבקות. במלון מתפורר ולוהט הוא נתקע מול הדף הריק ומתיידד עם השכן שלו, סוכן ביטוח. קומדיה שחורה ומוזרה של האחים כהן.", "ac": ["דקל הזהב, קאן 1991"]}, {"id": 337, "t": "Fargo", "y": 1996, "m": ["S", "L"], "f": "l", "h": 1, "s": "r", "d": 98, "l": "en", "w": ["crime"], "a": ["a"], "i": "tt0116282", "dr": ["ג'ואל כהן", "איתן כהן"], "c": ["פרנסס מקדורמנד", "ויליאם ה. מייסי", "סטיב בושמי"], "sy": "מינסוטה המושלגת. ג'רי, מוכר מכוניות שקוע בחובות, שוכר שני פושעים כדי שיחטפו את אשתו, וחותנו העשיר ישלם כופר. התוכנית משתבשת מהר מאוד, ומרג', שוטרת בהריון, נחמדה ועקשנית, מתחילה לחקור. קומדיה שחורה ואלימה של האחים כהן."}, {"id": 338, "t": "Crimes and Misdemeanors", "y": 1989, "m": ["T", "L"], "f": "l", "h": 0, "s": "r", "d": 104, "l": "en", "w": ["life", "crime"], "a": ["a"], "i": "tt0097123", "dr": ["וודי אלן"], "c": ["מרטין לנדאו", "וודי אלן", "אנג'ליקה יוסטון"], "sy": "שני סיפורים מקבילים בניו יורק. רופא עיניים מכובד מגלה שהפילגש שלו מאיימת לחשוף אותו ושוקל צעד נורא, ובמאי סרטים תיעודיים מתוסכל מצלם את גיסו המצליח והמתנשא. סרט על אשמה, מוסר ואלוהים, חצי דרמה וחצי קומדיה, של וודי אלן."}, {"id": 339, "t": "ואלס עם באשיר · Waltz with Bashir", "y": 2008, "m": ["T"], "f": "a", "h": 1, "s": "m", "l": "he", "w": ["war", "hist"], "a": ["a"], "dr": ["ארי פולמן"], "c": ["ארי פולמן"], "sy": "חבר מספר לארי פולמן על חלום חוזר שבו רודפים אחריו 26 כלבים, וארי מגלה שהוא לא זוכר כמעט כלום ממלחמת לבנון הראשונה, שבה לחם כחייל צעיר. הוא יוצא לפגוש חברים מאז כדי לשחזר את הזיכרונות. סרט אנימציה תיעודי של ארי פולמן.", "d": 90, "i": "tt1185616"}, {"id": 340, "t": "גט · Gett", "y": 2014, "m": ["T"], "f": "l", "h": 0, "s": "r", "l": "he", "w": ["life", "pol"], "a": ["a"], "dr": ["רונית אלקבץ", "שלומי אלקבץ"], "c": ["רונית אלקבץ", "מנשה נוי", "שמעון אבקריאן"], "sy": "ויויאן אמסלם רוצה להתגרש מבעלה אחרי שנים של נישואים אומללים, אבל בישראל רק הבעל יכול לתת גט, והוא מסרב. במשך חמש שנים היא חוזרת שוב ושוב לבית הדין הרבני. כל הסרט מתרחש באולם אחד. סרט של רונית ושלומי אלקבץ.", "d": 115, "i": "tt3062880"}, {"id": 341, "t": "לבנון · Lebanon", "y": 2009, "m": ["T", "S"], "f": "l", "h": 1, "s": "r", "l": "he", "w": ["war"], "a": ["a"], "dr": ["שמוליק מעוז"], "c": ["אושרי כהן", "איתי תירן", "יואב דונת"], "ac": ["אריה הזהב, ונציה 2009"], "sy": "היום הראשון של מלחמת לבנון הראשונה, יוני 1982. ארבעה חיילים צעירים בתוך טנק אחד נשלחים לעיר שהופצצה. את המלחמה הם רואים רק דרך הכוונת. סרט של שמוליק מעוז, מבוסס על מה שהוא עצמו עבר.", "d": 90, "i": "tt1483831"}, {"id": 342, "t": "Close-Up", "y": 1990, "m": ["T"], "f": "l", "h": 0, "s": "m", "d": 98, "l": "ot", "w": ["art", "crime"], "a": ["t", "a"], "i": "tt0100234", "dr": ["עבאס קיארוסטמי"], "c": ["חוסיין סבזיאן", "מוחסן מח'מלבאף"], "ac": ["סייט אנד סאונד 2022: בעשירייה הראשונה של סקר הבמאים"], "sy": "טהרן. חוסיין סבזיאן, אדם עני ומובטל שאוהב קולנוע, מתחזה לבמאי המפורסם מוחסן מח'מלבאף ונכנס לביתה של משפחה אמידה, שמאמינה שתככב בסרט שלו. כשהתרמית מתגלה הוא נעצר. קיארוסטמי משחזר את הפרשה האמיתית עם האנשים עצמם, בין תיעוד לבדיון."}, {"id": 343, "t" /* ---------- filtering ---------- */
const KEYS=['a','m','f','h','s','p','l','w'];
function val(f,k){ return k==='m'?f.m : k==='w'?f.w : k==='a'?f.a : [String(f[k])]; }
function match(f, skip){
  if(f.hidden && !(editing && view==='table')) return false;
  const wishMode = onlyWish && watchOK;
  if(!wishMode){
  for(const k of KEYS){
    if(k===skip || !S[k].size) continue;
    if(k==='a'){ if(![...S.a].every(x=>f.a.includes(x))) return false; continue; }
    if(!val(f,k).some(x=>S[k].has(x))) return false;
  }
  if(f.y<S.y0||f.y>S.y1) return false;
  if(f.d>S.d) return false;
  }
  if(query && !f.t.toLowerCase().includes(query)) return false;
  if(whoSel && watchOK){ const seen=!!WATCHED[f.id]?.[whoSel]; if(whoMode==='seen'?!seen:seen) return false; }
  if(onlyExtras && !extrasOf(f).length) return false;
  if(onlyWish && watchOK && !WISH[f.id]) return false;
  return true;
}
function score(f){return f.m.filter(x=>S.m.has(x)).length*10 + f.w.filter(x=>S.w.has(x)).length}
const SORTS={
  match:(a,b)=>score(b)-score(a)||(b.lb||0)-(a.lb||0)||b.y-a.y,   // lb = Letterboxd average rating
  new:(a,b)=>b.y-a.y||a.t.localeCompare(b.t),
  old:(a,b)=>a.y-b.y||a.t.localeCompare(b.t),
  short:(a,b)=>a.d-b.d||a.t.localeCompare(b.t),
  abc:(a,b)=>a.t.localeCompare(b.t,'he'),
};

/* grey out options that would give zero results */
function hasVal(f,k,set){ return k==='a' ? [...set].every(x=>f.a.includes(x)) : val(f,k).some(x=>set.has(x)); }
function updateChips(){
  const pools={};
  for(const k of KEYS) pools[k]=FILMS.filter(f=>match(f,k));
  const nowCount=FILMS.filter(f=>match(f)).length;
  document.querySelectorAll('.filters .chip').forEach(b=>{
    const k=b.dataset.k, v=b.dataset.v, on=S[k].has(v);
    const n=pools[k].filter(f=>val(f,k).includes(v)).length;
    b.setAttribute('aria-pressed',on);
    // what the result count would be if this option were switched on
    const next = new Set([...S[k],v]);
    const after = pools[k].filter(f=>hasVal(f,k,next)).length;
    b.disabled = !on && (after===0 || after===nowCount);
    const c=b.querySelector('.c'); if(c) c.textContent=n;
    b.title = n+' סרטים';
  });
  // when every option in a group is greyed out, say why (all results share one value)
  document.querySelectorAll('.filters .chips').forEach(g=>{
    const chips=[...g.querySelectorAll('.chip')]; if(!chips.length) return;
    let note=g.previousElementSibling&&g.previousElementSibling.classList.contains('group-note')?g.previousElementSibling:null;
    const allOff=chips.every(b=>b.disabled), anyOn=chips.some(b=>b.getAttribute('aria-pressed')==='true');
    const k=chips[0].dataset.k;
    let msg='';
    if(allOff && !anyOn && nowCount){
      const shared=chips.filter(b=>FILMS.filter(f=>match(f)).every(f=>val(f,k).includes(b.dataset.v))).map(b=>b.firstChild.textContent.trim());
      msg = shared.length ? `כל ${nowCount} התוצאות: ${shared.join(', ')}` : '';
    }
    if(msg){ if(!note){ note=document.createElement('div'); note.className='group-note'; g.before(note); } note.textContent=msg; }
    else if(note) note.remove();
  });
}

/* ---------- rendering ---------- */
const PAL=[['#7a2e1f','#e8b04a'],['#1f3b4d','#f3ead9'],['#3d2a4f','#f0c27b'],['#28402e','#e9e2c8'],['#5a1f2e','#f5d6a1'],['#2f2f2f','#e8b04a'],['#4a3520','#fbe3b0']];
function hash(s){let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)}
function posterHTML(f){
  const p=POSTERS[f.id];
  if(p) return `<img src="${p}" alt="" loading="lazy">`;
  const [bg,fg]=PAL[hash(f.id)%PAL.length];

}
function cardHTML(f){

    <div class="poster">${posterHTML(f)}${f.f!=='l'?`<span class="badge">${FL[f.f]}</span>`:''}${editing&&f.edited?`<span class="badge edited">${f.added?'חדש':'נערך'}</span>`:''}${extrasOf(f).length?`<span class="badge clip-b" title="יש חומרים משלימים">📎</span>`:''}</div>
    <h3>${esc(f.t)}</h3>
    <div class="meta">${f.y} · ${f.d} דק׳</div>
    <div class="worlds">${f.w.map(w=>`<span>${WL[w]||w}</span>`).join('')}</div>
  </article>`;
}
function wishListHTML(list){
  return `<p class="whint">גוררים שורה למעלה או למטה כדי לשנות את הסדר · לחיצה פותחת את כרטיס הסרט</p>
  <ol class="wlist" id="wlist">${list.map((f,i)=>`<li class="wrow" data-wid="${f.id}">
    <span class="num">${i+1}</span>

    <span class="grip" title="גרירה">⋮⋮</span></li>`).join('')}</ol>`;
}
function wishSort(a,b){
  const A=WISH[a.id]||{}, B=WISH[b.id]||{};
  const ao=A.order, bo=B.order;
  if(ao==null && bo==null) return (B.added||0)-(A.added||0);
  if(ao==null) return -1;          // newly added (not yet placed) go to the top
  if(bo==null) return 1;
  return ao-bo;
}
let wishDrag=null;
function bindWishDrag(){
  const ol=$('wlist'); if(!ol) return;
  ol.querySelectorAll('.wrow').forEach(row=>row.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    // on touch screens, drag only from the grip so the page can still scroll
    if(e.pointerType!=='mouse' && !e.target.closest('.grip')) return;
    if(e.target.closest('.grip')) e.preventDefault();
    wishDrag={row,ol,y0:e.clientY,moved:false};
  }));
}
document.addEventListener('pointermove',e=>{
  const d=wishDrag; if(!d) return;
  if(!d.moved && Math.abs(e.clientY-d.y0)<6) return;
  if(!d.moved){ d.moved=true; d.row.classList.add('dragging'); document.body.style.cursor='grabbing'; }
  e.preventDefault();
  const rows=[...d.ol.querySelectorAll('.wrow')].filter(r=>r!==d.row);
  const after=rows.find(r=>{const b=r.getBoundingClientRect(); return e.clientY < b.top+b.height/2;});
  if(after){ if(d.row.nextElementSibling!==after) d.ol.insertBefore(d.row,after); }
  else if(d.ol.lastElementChild!==d.row) d.ol.appendChild(d.row);
  [...d.ol.querySelectorAll('.wrow .num')].forEach((n,i)=>n.textContent=i+1);
},{passive:false});
const endWishDrag=async e=>{
  const d=wishDrag; if(!d) return; wishDrag=null;
  d.row.classList.remove('dragging'); document.body.style.cursor='';
  if(!d.moved){ if(e.type==='pointerup'){ const f=FILMS.find(x=>String(x.id)===d.row.dataset.wid); if(f) openFilm(f); } return; }
  await saveWishOrder([...d.ol.querySelectorAll('.wrow')].map(r=>r.dataset.wid));
};
document.addEventListener('pointerup',endWishDrag);
document.addEventListener('pointercancel',endWishDrag);
async function saveWishOrder(ids){
  // films in the list but hidden by search etc. keep their place after the visible ones
  const rest=Object.keys(WISH).filter(id=>!ids.includes(id)).sort((a,b)=>wishSort({id:a},{id:b}));
  const all=[...ids,...rest];
  try{
    await Promise.all(all.map((id,i)=>{
      if(WISH[id]?.order===i) return null;
      const doc={added:WISH[id]?.added||Date.now(),order:i}; WISH[id]=doc;
      return null;
    }));
    await api('wishOrder',{ids:all});
  }catch(e){ toast('שמירת הסדר נכשלה'); render(); }
}
function tableHTML(list){
  const tg=a=>a.map(x=>`<span class="tg">${x}</span>`).join('');
  return `<div class="tablewrap"><table><thead><tr>
    <th>שם</th><th>גיל</th><th>שנה</th><th>דק׳</th><th>מצב רוח</th><th>עולם</th><th>סוג</th><th>סגנון</th><th>שפה</th><th>קשה</th>${watchOK?'<th>ראו</th>':''}<th>📎</th></tr></thead><tbody>
    ${list.map(f=>`<tr data-id="${f.id}" class="${f.hidden?'hidden-film':''}">
      <td class="t">${esc(f.t)}${f.hidden?' <small>(מוסתר)</small>':''}${editing&&f.edited&&!f.hidden?' <small style="color:#9fd3a8">●</small>':''}</td>
      <td>${f.a.map(x=>AL[x]).join(', ')}</td><td>${f.y}</td><td>${f.d}</td>

    </tr>`).join('')}</tbody></table></div>`;

let current=[];
function labelFor(k,v){
  if(k==='a') return 'מתאים ל'+AL[v];
  if(k==='h') return v==='0'?'בלי תכנים קשים':'כולל תכנים קשים';
  return ({m:ML,f:FL,s:SL,l:LL,w:WL}[k]||{})[v]||v;
}
// which single filter to release to get more results
function relaxOptions(){
  const cnt=()=>FILMS.filter(f=>!f.hidden&&match(f)).length;
  const now=cnt(), out=[];
  const tryIt=(label,apply,undo)=>{ apply(); const n=cnt(); undo(); if(n>now) out.push({label,n,apply}); };
  for(const k of KEYS){
    if(!S[k].size) continue;
    if(k==='a'){ for(const v of [...S.a]) tryIt(labelFor(k,v),()=>S.a.delete(v),()=>S.a.add(v)); continue; }
    const saved=[...S[k]];
    tryIt(saved.map(v=>labelFor(k,v)).join(' / '),()=>S[k].clear(),()=>saved.forEach(v=>S[k].add(v)));
  }
  if(S.y0>YMIN||S.y1<YMAX){ const a=S.y0,b=S.y1; tryIt(`שנים ${a}–${b}`,()=>{S.y0=YMIN;S.y1=YMAX;},()=>{S.y0=a;S.y1=b;}); }
  if(S.d<DMAX){ const d=S.d; tryIt(`עד ${d} דק׳`,()=>{S.d=DMAX;},()=>{S.d=d;}); }
  if(query){ const q=query; tryIt(`החיפוש ״${q}״`,()=>{query='';},()=>{query=q;}); }
  if(whoSel&&watchOK){ const w=whoSel; tryIt(`${WHL[w]} ${whoMode==='seen'?'ראו':'לא ראו'}`,()=>{whoSel=null;},()=>{whoSel=w;}); }
  if(onlyExtras) tryIt('📎 חומרים משלימים',()=>{onlyExtras=false;},()=>{onlyExtras=true;});
  return out.sort((x,y)=>y.n-x.n).slice(0,3);
}
function syncUIFromState(){
  $('y0').value=S.y0; $('y1').value=S.y1; $('dmax').value=S.d; syncRanges();
  $('q').value=query;
  document.querySelectorAll('[data-who]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.who===whoSel));
  $('clipBtn').setAttribute('aria-pressed',onlyExtras);
}
function relaxHTML(opts){
  if(!opts.length) return '';
  return `<div class="relax"><span>אפשר לשחרר:</span>${opts.map((o,i)=>`<button type="button" data-relax="${i}">${esc(o.label)} ← <b>${o.n}</b> סרטים</button>`).join('')}</div>`;
}
function bindRelax(opts){
  document.querySelectorAll('[data-relax]').forEach(b=>b.onclick=()=>{ opts[+b.dataset.relax].apply(); syncUIFromState(); render(); });
}
function render(){
  updateChips();
  current = FILMS.filter(f=>match(f)).sort(SORTS[sortBy]);
  if(onlyWish && watchOK) current.sort(wishSort);
  const visibleN=current.filter(f=>!f.hidden).length;
  const relax = (!(onlyWish&&watchOK) && visibleN<=2) ? relaxOptions() : [];
  $('n').textContent=current.filter(f=>!f.hidden).length;
  const size=+$('size').value;
  document.documentElement.style.setProperty('--poster',size+'px');
  if(!current.length){
    $('results').innerHTML=`<div class="empty">אין סרט שעונה על כל הבחירות${relax.length?relaxHTML(relax):' — נסו לשחרר אחת מהן'}</div>`;
  } else if(onlyWish && watchOK){
    $('results').innerHTML=wishListHTML(current.filter(f=>!f.hidden)); bindWishDrag();
  } else if(view==='table'){
    $('results').innerHTML=relaxHTML(relax)+tableHTML(current);
  } else {
    $('results').innerHTML=relaxHTML(relax)+`<div class="gridwrap"><div class="grid ${size<130?'compact':''} ${size<95?'tiny':''}">${current.map(cardHTML).join('')}</div></div>`;
  }
  bindRelax(relax);
  const wishMode = onlyWish && watchOK;
  $('panel').classList.toggle('paused',wishMode);
  const tags=[];
  if(!wishMode){
  S.a.forEach(v=>tags.push('מתאים ל'+AL[v]));S.m.forEach(v=>tags.push(ML[v]));S.f.forEach(v=>tags.push(FL[v]));
  S.h.forEach(v=>tags.push(v==='0'?'בלי תכנים קשים':'כולל תכנים קשים'));
  S.s.forEach(v=>tags.push(SL[v]));
  S.l.forEach(v=>tags.push(LL[v]));S.w.forEach(v=>tags.push(WL[v]));
  if(S.y0>YMIN||S.y1<YMAX)tags.push(`${S.y0}–${S.y1}`); if(S.d<DMAX)tags.push(`עד ${S.d} דק׳`);
  }
  if(query)tags.push(`״${query}״`);
  if(whoSel&&watchOK)tags.push(`${WHL[whoSel]} ${whoMode==='seen'?(VFEM[whoSel]?'ראתה':'ראה'):(VFEM[whoSel]?'עוד לא ראתה':'עוד לא ראה')}`);
  if(onlyExtras)tags.push('📎 עם חומרים משלימים');
  if(onlyWish&&watchOK)tags.push('🍿 רשימת צפייה');
  if(watchOK) $('wishN').textContent=Object.keys(WISH).length||'';
  $('active').innerHTML=tags.map(t=>`<span>${esc(t)}</span>`).join('');
  const nEd=Object.keys(EDITS).length;
  $('editCount').textContent = nEd ? `(${nEd} סרטים נערכו עד עכשיו)` : '';
}

      <dt>עולם</dt><dd>${f.w.map(w=>WL[w]||w).join(' · ')}</dd>
      <dt>סוג</dt><dd>${FL[f.f]} · ${SL[f.s]}</dd>
      <dt>שפה</dt><dd>${LL[f.l]}</dd>
      <dt>תכנים</dt><dd>${f.h?'כולל תכנים קשים לצפייה':'ללא תכנים קשים'}</dd>

  bindWatched(f);
  renderExtras(f);
  $('modal').classList.add('show');
}
function bindWatched(f){
  $('sheet').querySelectorAll('[data-w]').forEach(b=>b.onclick=async()=>{
    const cur={...(WATCHED[f.id]||{})}; cur[b.dataset.w]=!cur[b.dataset.w];
    b.setAttribute('aria-pressed',cur[b.dataset.w]);
    try{ await api('watched',{id:f.id, viewers:Object.keys(cur).filter(k=>cur[k])}); WATCHED[f.id]=cur; render(); }catch(e){ toast('השמירה נכשלה'); b.setAttribute('aria-pressed',!cur[b.dataset.w]); return; }
  });
  const wb=$('sheet').querySelector('[data-wish]');
  if(wb){ paintWish(f); wb.onclick=async()=>{ await setWish(f,!WISH[f.id]); toast(WISH[f.id]?'נוסף לרשימת הצפייה':'הוסר מרשימת הצפייה'); }; }
}
function paintWish(f){
  const wb=$('sheet').querySelector('[data-wish]'); if(!wb) return;
  const on=!!WISH[f.id];
  wb.textContent = on ? '✓ ברשימת הצפייה · להסרה' : '＋ הוסף לרשימת צפייה';
  wb.classList.toggle('gold',!on);
}
async function setWish(f,on){
  try{
    const added=Date.now();
    await api('wish',{id:f.id,on,added});
    if(on) WISH[f.id]={added}; else delete WISH[f.id];
    paintWish(f); render();
  }catch(e){ toast('השמירה נכשלה'); }
}
function isYT(u){return /youtube\.com|youtu\.be/.test(u)}
function safeUrl(u){ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:null; }catch(e){ return null; } }
function renderExtras(f){
  const items=extrasOf(f), box=$('extras'); if(!box) return;
  if(!items.length){ box.remove(); return; }
  box.innerHTML=`<h4><span>📎 חומרים משלימים</span></h4>
    <ul>${items.map(x=>{
      const u=x.url&&safeUrl(x.url);
      return `<li>${u?`<a href="${esc(u)}" target="_blank" rel="noopener">${isYT(u)?'▶ ':''}${esc(x.title||u)} ↗</a>`:`<b>${esc(x.title||'')}</b>`}
        ${x.text?`<div class="xt">${esc(x.text)}</div>${x.text.length>300?'<button class="more">להמשך קריאה</button>':''}`:''}</li>`;}).join('')}</ul>`;
  box.querySelectorAll('.more').forEach(b=>b.onclick=()=>{const t=b.previousElementSibling;t.classList.toggle('open');b.textContent=t.classList.contains('open')?'פחות':'להמשך קריאה';});
}
function xItemHTML(x={}){
  return `<div class="xi"><input data-x="title" placeholder="כותרת (למשל: מייקינג אוף)" value="${esc(x.title||'')}">
    <input data-x="url" placeholder="קישור (לא חובה)" dir="ltr" value="${esc(x.url||'')}">
    <textarea data-x="text" placeholder="טקסט חופשי (לא חובה)">${esc(x.text||'')}</textarea>
    <button type="button" class="xdel">× מחיקת הפריט</button></div>`;
}
function readExtrasEditor(){
  const items=[]; let err='';
  $('sheet').querySelectorAll('.xedit .xi').forEach(el=>{
    const it={}; el.querySelectorAll('[data-x]').forEach(i=>{ const v=i.value.trim(); if(v) it[i.dataset.x]=v; });
    if(!Object.keys(it).length) return;
    if(it.url && !safeUrl(it.url)) err='קישור לא תקין בחומרים המשלימים — צריך להתחיל ב־https://';
    else if(!it.url && !it.text) err='כל חומר משלים צריך קישור או טקסט';
    items.push(it);
  });
  return {items,err};
}
async function saveExtras(f,items){
  try{ await api('extras',{id:f.id,items}); EXTRAS_DB[f.id]={items}; return true; }
  catch(e){ return false; }
}
function closeModal(){$('modal').classList.remove('show')}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('.close'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});


/* ---------- editor ---------- */
function editChips(name, items, selected, multi){
  return `<div class="chips" data-name="${name}" data-multi="${multi?1:0}">`+items.map(([v,l])=>
    `<button type="button" class="chip" data-v="${v}" aria-pressed="${selected.includes(v)}">${l}</button>`).join('')+`</div>`;
}
function openEditor(f){
  const isNew=!f;
  f = f || {id:'n'+Date.now().toString(36), a:['t','a'], t:'', y:new Date().getFullYear(), d:100, m:[], w:[], f:'l', h:0, s:'r', p:0, l:'en'};
  const base=BASE.find(b=>String(b.id)===String(f.id));
  $('sheet').innerHTML=`<button class="close" aria-label="סגירה">×</button>
    <div class="poster">${posterHTML(f)}</div>
    <form id="ef">
      <h3 style="font-size:22px">${isNew?'הוספת סרט':'עריכת כרטיס הסרט'}</h3>
      <div class="field"><label>שם הסרט</label><input name="t" value="${esc(f.t)}" required></div>
      <div class="row2"><div class="field"><label>שנה</label><input name="y" type="number" min="1890" max="2100" value="${f.y}" required></div>
      <div class="field"><label>אורך (דקות)</label><input name="d" type="number" min="1" max="600" value="${f.d}" required></div></div>
      <div class="row2"><div class="field"><label>בימוי</label><input name="dr" value="${esc((f.dr||[]).join(', '))}"></div>
      <div class="field"><label>שחקנים ראשיים (מופרדים בפסיק)</label><input name="c" value="${esc((f.c||[]).join(', '))}"></div></div>
      <div class="field"><label>תקציר</label><textarea name="sy" rows="4" style="min-height:90px">${esc(f.sy||'')}</textarea></div>
      <div class="field"><label>פרסים (אם יש כמה, מפרידים בנקודה ·)</label><input name="ac" value="${esc((f.ac||[]).join(' · '))}" placeholder="למשל: דקל הזהב, קאן 1979"></div>
      <div class="field"><label>קישור IMDb (או מזהה tt…)</label><input name="i" value="${f.i?`https://www.imdb.com/title/${f.i}/`:''}" placeholder="https://www.imdb.com/title/tt…" dir="ltr"></div>
      ${watchOK&&!isNew?`<div class="field"><label>מי ראה (נשמר מיד בלחיצה)</label><div class="chips">${WHO.map(([k,n])=>`<button type="button" class="chip" data-w="${k}" aria-pressed="${!!WATCHED[f.id]?.[k]}">${n}</button>`).join('')}</div></div>
      <div class="field"><button type="button" class="btn small wish" data-wish></button></div>`:''}
      <div class="field"><label>מתאים ל (אפשר כמה)</label>${editChips('a',AGES,f.a,true)}</div>
      <div class="field"><label>מצב רוח</label>${editChips('m',MOODS,f.m,true)}</div>
      <div class="field"><label>עולם</label>${editChips('w',WORLDS,f.w,true)}</div>
      <div class="field"><label>סוג</label>${editChips('f',FORMATS,[f.f],false)}</div>
      <div class="field"><label>תכנים</label>${editChips('h',HARD,[String(f.h)],false)}</div>
      <div class="field"><label>סגנון</label>${editChips('s',STYLES,[f.s],false)}</div>
      <div class="field"><label>שפה</label>${editChips('l',LANGS,[f.l],false)}</div>
      <div class="field"><label>📎 חומרים משלימים</label><div class="xedit" id="xedit">${extrasOf(f).map(xItemHTML).join('')}</div>
        <button type="button" class="btn small" id="xAdd" style="align-self:flex-start;margin-top:6px">＋ הוספת חומר</button></div>
      <div class="edit-actions">
        <button class="btn gold" type="submit">שמירה</button>
        <button class="btn" type="button" id="eCancel">ביטול</button>
        ${!isNew&&base&&EDITS[f.id]&&!f.hidden?`<button class="btn" type="button" id="eRevert">החזרה למקור</button>`:''}
        ${!isNew&&base?`<button class="btn" type="button" id="eHide">${f.hidden?'החזרה למחולל':'הסתרה מהמחולל'}</button>`:''}
        ${!isNew?`<button class="btn" type="button" id="eDel">מחיקת הסרט</button>`:''}
      </div>
      <div class="note" id="eMsg"></div>
    </form>`;
  bindWatched(f);
  $('sheet').querySelectorAll('.chips[data-name] .chip').forEach(b=>b.onclick=()=>{
    const g=b.parentElement;
    if(g.dataset.multi==='1') b.setAttribute('aria-pressed', b.getAttribute('aria-pressed')!=='true');
    else g.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',x===b));
  });
  const pick=(n)=>[...$('sheet').querySelectorAll(`.chips[data-name="${n}"] .chip[aria-pressed=true]`)].map(b=>b.dataset.v);
  $('eCancel').onclick=closeModal;
  const xBox=$('xedit');
  const bindX=()=>xBox.querySelectorAll('.xdel').forEach(b=>b.onclick=()=>b.closest('.xi').remove());
  bindX();
  $('xAdd').onclick=()=>{ xBox.insertAdjacentHTML('beforeend',xItemHTML()); bindX(); xBox.lastElementChild.querySelector('input').focus(); };
  $('ef').onsubmit=async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const im=(String(fd.get('i')||'').match(/tt\d{6,10}/)||[])[0];
    const list=n=>String(fd.get(n)||'').split(/[,،]/).map(s=>s.trim()).filter(Boolean);
    const obj={a:pick('a'), ...(im?{i:im}:{}), dr:list('dr'), c:list('c'),
      sy:String(fd.get('sy')||'').trim(), ac:String(fd.get('ac')||'').split('·').map(x=>x.trim()).filter(Boolean), t:fd.get('t').trim(), y:+fd.get('y'), d:+fd.get('d'), m:pick('m'), w:pick('w'),
      f:pick('f')[0], h:+pick('h')[0], s:pick('s')[0], l:pick('l')[0]};
    if(!obj.t){ $('eMsg').textContent='חסר שם לסרט'; return; }
    if(!obj.a.length||!obj.m.length||!obj.w.length){ $('eMsg').textContent='צריך לבחור לפחות גיל אחד, מצב רוח אחד ועולם אחד'; return; }
    const X=readExtrasEditor(); if(X.err){ $('eMsg').textContent=X.err; return; }
    if(JSON.stringify(X.items)!==JSON.stringify(extrasOf(f))){
      if(!(await saveExtras(f,X.items))){ $('eMsg').textContent='שמירת החומרים המשלימים נכשלה'; return; }
    }
    const norm=o=>JSON.stringify(Object.keys(obj).sort().map(k=>{const v=o[k]; return [k, v==null ? (Array.isArray(obj[k])?[]:(typeof obj[k]==='string'?'':v)) : (Array.isArray(v)?[...v]:v)];}));
    if(!isNew && norm(f)===norm(obj)){ closeModal(); toast('נשמר'); render(); return; }
    await save(String(f.id), obj);
  };
  if($('eRevert')) $('eRevert').onclick=()=>remove(String(f.id),'הסרט חזר לתגיות המקוריות');
  if($('eDel')) $('eDel').onclick=()=>{ if(confirm('למחוק את הסרט מהמאגר?')) remove(String(f.id),'הסרט נמחק'); };
  if($('eHide')) $('eHide').onclick=()=>{
    if(f.hidden) save(String(f.id),{hidden:false},'הסרט חזר למחולל');
    else save(String(f.id),{hidden:true},'הסרט הוסתר — הוא עדיין מופיע בטבלה במצב עריכה');
  };
  $('modal').classList.add('show');
}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2600);}
async function save(id,obj,msg='נשמר'){
  const isNew = !FILMS.some(f=>String(f.id)===String(id));
  const cur = isNew ? {} : {...FILMS.find(f=>String(f.id)===String(id))};
  ['edited','added','x'].forEach(k=>delete cur[k]);
  const film = {...cur, ...obj, id: isNew?null:Number(id)};
  try{
    const r = await api('film',{film});
    const nf = {...film, id:r.id};
    BASE = isNew ? [...BASE, nf] : BASE.map(f=>String(f.id)===String(r.id)?nf:f);
    rebuild(); bounds(); closeModal(); toast(msg); render();
  }catch(e){ $('eMsg').textContent = e.message==='forbidden' ? 'אין הרשאת עריכה בקישור הזה' : 'השמירה נכשלה'; }
}
async function remove(id,msg){
  const f=FILMS.find(x=>String(x.id)===String(id)); if(!f) return;
  await save(id,{...f,deleted:true},msg);
  BASE=BASE.filter(x=>String(x.id)!==String(id)); rebuild(); render();
}
$('editToggle').onclick=()=>{editing=!editing;document.body.classList.toggle('editing',editing);$('editToggle').textContent=editing?'סיום עריכה':'✏️ עריכת מאגר הסרטים';render();};
$('editDone').onclick=()=>$('editToggle').click();
$('addFilm').onclick=()=>openEditor(null);

setRangeBounds(); $('y0').value=YMIN; $('y1').value=YMAX; $('dmax').value=DMAX;
syncRanges(); render();

/* ---------- connect to the shared sheet ---------- */
const qs=new URLSearchParams(location.search);
if(qs.get('s')){ try{ localStorage.setItem('kolnoa_space',JSON.stringify({s:qs.get('s'),k:qs.get('k')||''})); }catch(e){} }
let CRED={s:'',k:''}; try{ CRED=JSON.parse(localStorage.getItem('kolnoa_space')||'{}')||{}; }catch(e){}
if(qs.get('s')) CRED={s:qs.get('s'),k:qs.get('k')||''};
async function api(action,payload){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,space:CRED.s,key:CRED.k,...payload})});
  const j=await r.json(); if(!j.ok) throw new Error(j.error||'error'); return j;
}
let loading=false;
async function load(){
  if(!API || loading) return; loading=true;
  try{
    const u=API+'?space='+encodeURIComponent(CRED.s||'')+'&key='+encodeURIComponent(CRED.k||'')+'&t='+Date.now();
    const j=await (await fetch(u)).json();
    Object.assign(window.POSTERS, j.posters||{});
    const prevBounds=[YMIN,YMAX,DMAX];
    BASE=j.films; EXTRAS_DB=Object.fromEntries(Object.entries(j.extras||{}).map(([id,items])=>[id,{items}]));
    rebuild(); bounds();
    if(prevBounds.join()!==[YMIN,YMAX,DMAX].join()){
      const wasFull=[S.y0===prevBounds[0],S.y1===prevBounds[1],S.d===prevBounds[2]];
      setRangeBounds();
      if(wasFull[0])$('y0').value=YMIN; if(wasFull[1])$('y1').value=YMAX; if(wasFull[2])$('dmax').value=DMAX;
      syncRanges();
    }
    SPACE=j.space;
    if(SPACE){
      WHO=(SPACE.viewers||[]).map(v=>[v.k,v.name]); WHL=Object.fromEntries(WHO); VFEM=Object.fromEntries((SPACE.viewers||[]).map(v=>[v.k,!!v.f]));
      WATCHED={}; for(const [id,ks] of Object.entries(j.watched||{})){ WATCHED[id]=Object.fromEntries(ks.map(k=>[k,true])); }
      WISH=j.watchlist||{};
      watchOK=true; canEdit=!!SPACE.canEdit;
      $('whoBar').hidden=false; $('wishBtn').hidden=false; $('editToggle').hidden=!canEdit;
      paintWho();
    } else {
      watchOK=false; canEdit=false; $('whoBar').hidden=true; $('wishBtn').hidden=true; $('editToggle').hidden=true;
      if(j.badKey) toast('הקישור הזה לא תקין — בקשו קישור חדש');
    }
    if(!$('modal').classList.contains('show')) render();
  }catch(e){ console.warn('load failed',e); }
  finally{ loading=false; }
}
load();
setInterval(()=>{ if(document.visibilityState==='visible') load(); }, 60000);
addEventListener('focus',()=>load());

/* viewers editor (each space manages its own list) */
$('viewersBtn').onclick=()=>{
  const list=(SPACE?.viewers||[]).map(v=>({...v}));
  const draw=()=>{
    $('sheet').innerHTML=`<button class="x" onclick="closeModal()">×</button><h3 style="font-size:22px">מי צופה?</h3>
      <p class="note">השמות שמופיעים ב"מי ראה?" ובסימון "ראינו".</p>
      <div id="vlist">${list.map((v,i)=>`<div class="vrow"><input data-i="${i}" value="${esc(v.name)}"><label style="font-size:13px;color:var(--muted)"><input type="checkbox" data-f="${i}" ${v.f?'checked':''}> לשון נקבה</label><button class="btn small" data-del="${i}">×</button></div>`).join('')}</div>
      <button class="btn small" id="vAdd">＋ הוספת צופה</button>
      <div class="edit-actions"><button class="btn gold" id="vSave">שמירה</button><button class="btn" onclick="closeModal()">ביטול</button></div>`;
    $('sheet').querySelectorAll('[data-i]').forEach(i=>i.oninput=()=>list[i.dataset.i].name=i.value);
    $('sheet').querySelectorAll('[data-f]').forEach(i=>i.onchange=()=>list[i.dataset.f].f=i.checked);
    $('sheet').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{list.splice(+b.dataset.del,1);draw();});
    $('vAdd').onclick=()=>{ const used=new Set(list.map(v=>v.k)); let k; do{ k='v'+Math.random().toString(36).slice(2,6);}while(used.has(k)); list.push({k,name:''}); draw(); $('sheet').querySelector(`[data-i="${list.length-1}"]`).focus(); };
    $('vSave').onclick=async()=>{
      const clean=list.filter(v=>v.name.trim()).map(v=>({k:v.k,name:v.name.trim(),...(v.f?{f:true}:{})}));
      try{ await api('viewers',{viewers:clean}); SPACE.viewers=clean; closeModal(); toast('נשמר'); load(); }catch(e){ toast('השמירה נכשלה'); }
    };
  };
  draw(); $('modal').classList.add('show');
};
</script>
